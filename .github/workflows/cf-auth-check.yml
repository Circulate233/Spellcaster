name: CurseForge auth check (read-only, no upload)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Secret shape check (value never printed)
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          echo "length=${#CURSEFORGE_TOKEN} (expected 36)"
          if [[ "$CURSEFORGE_TOKEN" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "format=clean-uuid"
          else
            echo "format=NOT a clean uuid: extra whitespace/newline or wrong content"
          fi

      - name: Probe version-types (GET only, same client as the plugin)
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          mkdir -p /tmp/cfprobe && cat > /tmp/cfprobe/CfAuthTest.java <<'EOF'
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class CfAuthTest {
              public static void main(String[] args) throws Exception {
                  HttpURLConnection c = (HttpURLConnection) new URL(
                          "https://minecraft.curseforge.com/api/game/version-types").openConnection();
                  c.setRequestProperty("X-Api-Token", args[0]);
                  int code = c.getResponseCode();
                  InputStream in = code < 400 ? c.getInputStream() : c.getErrorStream();
                  byte[] buf = in.readNBytes(120);
                  System.out.println("HTTP " + code + " " + new String(buf).replaceAll("\\s+", " "));
              }
          }
          EOF
          cd /tmp/cfprobe
          echo "[1] secret as-is:"
          java CfAuthTest.java "$CURSEFORGE_TOKEN"
          echo "[2] secret + trailing space (simulates paste contamination):"
          java CfAuthTest.java "$CURSEFORGE_TOKEN "
